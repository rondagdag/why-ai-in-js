<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js Toxicity Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Toxicity Detection Demo</h1>
            <p>Analyze text for toxic content using TensorFlow.js</p>
        </header>
        
        <main>
            <div class="model-info">
                <h4>Model Status</h4>
                <p>Model: <span id="model-name">@tensorflow-models/toxicity</span></p>
                <p>Status: <span id="model-status">Initializing...</span></p>
                <p>Threshold: <span id="threshold">0.5</span></p>
            </div>
            
            <div class="input-section">
                <label for="text-input">Enter text to analyze for toxicity:</label>
                <textarea 
                    id="text-input" 
                    placeholder="Type a message to check for toxic content..."
                    rows="4"
                    disabled
                ></textarea>
                <button id="analyze-btn" disabled>
                    <span id="btn-text">Analyze Text</span>
                    <div id="btn-spinner" class="spinner" style="display: none;"></div>
                </button>
            </div>
            
            <div class="results-section">
                <h3>Toxicity Analysis Results</h3>
                <div id="results-container">
                    <div class="result-placeholder">
                        Results will appear here after analysis...
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <a href="../index.html">← Back to Demos</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
