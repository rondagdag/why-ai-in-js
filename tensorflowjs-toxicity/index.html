<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TensorFlow.js Toxicity Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="title-section">
                    <h1>🛡️ Toxicity Detection</h1>
                    <p>Real-time content moderation using TensorFlow.js</p>
                </div>
                <div class="model-badge">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="model-status">Initializing...</span>
                </div>
            </div>
        </header>
        
        <main>
            <div class="controls-section">
                <!-- Preset Buttons -->
                <div class="presets">
                    <span class="label">Try an example:</span>
                    <div class="chip-container">
                        <button class="chip" data-text="Have a wonderful day!">😊 Safe</button>
                        <button class="chip" data-text="You are completely useless.">🤬 Insult</button>
                        <button class="chip" data-text="I will hurt you.">👊 Threat</button>
                        <button class="chip" data-text="You are an idiot and a fool.">🤪 Toxic</button>
                    </div>
                </div>

                <!-- Real-time Toggle -->
                <div class="toggle-container">
                    <label class="switch">
                        <input type="checkbox" id="realtime-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label">Real-time Analysis</span>
                </div>
            </div>
            
            <div class="input-section">
                <textarea 
                    id="text-input" 
                    placeholder="Type a message to check for toxic content..."
                    rows="4"
                    disabled
                ></textarea>
                <div class="action-bar">
                    <button id="analyze-btn" disabled>
                        <span id="btn-text">Analyze Text</span>
                        <div id="btn-spinner" class="spinner" style="display: none;"></div>
                    </button>
                    <span class="threshold-info">Threshold: <span id="threshold">0.5</span></span>
                </div>
            </div>
            
            <div class="results-section">
                <div id="results-container">
                    <div class="result-placeholder">
                        <div class="placeholder-icon">👋</div>
                        <p>Select an example above or type your own text to see the analysis.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <a href="../index.html">← Back to Demos</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
